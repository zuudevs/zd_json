name: CI

on:
  push:
    branches: [main]
    paths:
      - "include/**"
      - "internal/**"
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/**"

  pull_request:
    branches:
      - main
      - feature/**
      - fix/**
      - refactor/**
    paths:
      - "include/**"
      - "internal/**"
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/**"

jobs:
  build:
    name: "${{ matrix.name }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Debug + ASan/UBSan"
            build_type: Debug
            sanitizers: ON
            clang_tidy: OFF
            benchmarks: OFF

          - name: "Release + Benchmark"
            build_type: Release
            sanitizers: OFF
            clang_tidy: ON
            benchmarks: ON

    env:
      CC: clang
      CXX: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: 20

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Configure
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DZD_JSON_BUILD_TESTS=ON \
            -DZD_JSON_BUILD_BENCHMARKS=${{ matrix.benchmarks }} \
            -DZD_JSON_ENABLE_CLANG_TIDY=${{ matrix.clang_tidy }} \
            -DZD_JSON_ENABLE_SANITIZERS=${{ matrix.sanitizers }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Benchmark Smoke Test
        if: matrix.benchmarks == 'ON'
        run: |
          ./out/bin/zd_json_tokenizer_benchmarks --benchmark_min_time=0.01s
          ./out/bin/zd_json_lexer_benchmarks --benchmark_min_time=0.01s