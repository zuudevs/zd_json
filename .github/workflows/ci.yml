name: CI

on:
  push:
    branches: [main]
    paths:
      - "include/**"
      - "internal/**"
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/**"

  pull_request:
    branches:
      - main
      - feature/**
      - fix/**
      - refactor/**
    paths:
      - "include/**"
      - "internal/**"
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/**"

jobs:
  build:
    name: "${{ matrix.name }} (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux Debug + ASan/UBSan"
            os: ubuntu-latest
            preset: debug
            build_type: Debug
            sanitizers: ON
            clang_tidy: OFF
            benchmarks: OFF

          - name: "Linux Release + Benchmark"
            os: ubuntu-latest
            preset: release
            build_type: Release
            sanitizers: OFF
            clang_tidy: ON
            benchmarks: ON

          - name: "Windows Release (MSVC/Clang)"
            os: windows-latest
            preset: release
            build_type: Release
            sanitizers: OFF
            clang_tidy: OFF
            benchmarks: OFF

    env:
      CC: clang
      CXX: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: 20

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Configure & Build via Presets
        run: |
          cmake --preset ${{ matrix.preset }} -DZD_JSON_BUILD_TESTS=ON -DZD_JSON_BUILD_BENCHMARKS=${{ matrix.benchmarks }} -DZD_JSON_ENABLE_CLANG_TIDY=${{ matrix.clang_tidy }} -DZD_JSON_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
          cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test via Presets
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Benchmark Smoke Test
        if: matrix.benchmarks == 'ON'
        shell: bash
        run: |
          ./out/bin/zd_json_tokenizer_benchmarks --benchmark_min_time=0.01s
          ./out/bin/zd_json_lexer_benchmarks --benchmark_min_time=0.01s