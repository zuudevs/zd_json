name: Fuzzing

on:
  push:
    branches: [main]
    paths:
      - "include/**"
      - "internal/**"
      - "src/**"
      - "tests/fuzz/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/fuzz.yml"

  pull_request:
    branches:
      - main
      - feature/**
      - fix/**
      - refactor/**
    paths:
      - "include/**"
      - "internal/**"
      - "src/**"
      - "tests/fuzz/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/fuzz.yml"

jobs:
  fuzz:
    name: "Fuzzing (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      CC: clang
      CXX: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: 20

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Build Fuzz Targets
        run: |
          cmake --preset fuzz
          cmake --build --preset fuzz

      - name: Corpus Replay via CTest
        run: ctest --preset fuzz --output-on-failure

      - name: Run Fuzz Smoke Test
        shell: bash
        run: |
          ./out/bin/zd_fuzz_parse_run -runs=10000 tests/fuzz/corpus/fuzz_parse
          ./out/bin/zd_fuzz_roundtrip_run -runs=10000 tests/fuzz/corpus/fuzz_roundtrip
